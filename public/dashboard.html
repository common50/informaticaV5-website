<!doctype html>
<html>
<head>
    <title>dashboard</title>
    <link rel="stylesheet" href="meow.css">
    <script>
        document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
    </script>
</head>
<body>
    <div class="app">
        <nav class="icon-rail">
            <button class="rail-icon active" id="btnChats">💬</button> <!-- emojis zijn hier echt wel handig -->
            <button class="rail-icon" id="btnPeople">👥</button>
            <button class="rail-icon" id="btnShop">🛍️</button>
            <button class="rail-icon hidden" id="btnAdmin">🛡️</button>
            <button class="rail-icon" id="btnSettings">⚙️</button>
        </nav>

        <aside class="sidebar">
            <div class="view" id="chatsSidebar">
                <div class="sidebar-header">
                    <h2>chats</h2>
                    <div class="dezoekhoek">
                        <input type="text" id="chatSearch" placeholder="zoek een chat ofz" autocomplete="off">
                    </div>
                </div>
                <ul class="chat-list" id="chatList"></ul>

                <div class="sidebar-header team-header">
                    <h2>teams</h2>
                    <form class="team-form" id="teamForm">
                        <input type="text" id="teamName" placeholder="nieuw team" maxlength="100" autocomplete="off">
                        <button type="submit">maak</button>
                    </form>
                </div>
                <ul class="chat-list" id="teamList"></ul>
            </div>

            <div class="view hidden" id="peopleSidebar">
                <div class="sidebar-header">
                    <h2>mensen</h2>
                    <div class="dezoekhoek">
                        <input type="text" id="peopleSearch" placeholder="zoek iem" autocomplete="off">
                    </div>
                </div>
                <div class="chat-list" id="peopleList"></div>
            </div>

            <div class="view hidden" id="adminSidebar">
                <div class="sidebar-header">
                    <h2>moderatie</h2>
                    <div class="dezoekhoek">
                        <input type="text" id="adminSearch" placeholder="zoek user" autocomplete="off">
                    </div>
                </div>
                <div class="chat-list" id="adminUserList"></div>
            </div>

            <div class="view hidden" id="shopSidebar">
                <div class="sidebar-header">
                    <h2>winkel</h2>
                    <p class="shop-coins" id="shopCoins">…</p>
                </div>
            </div>

            <div class="view hidden" id="settingsSidebar">
                <div class="sidebar-header">
                    <h2>instellingen</h2>
                </div>
            </div>
        </aside>

        <main class="chat-view">
            <header class="chat-header">
                <h3 id="chatTitle">kies een chat</h3>
            </header>

            <div class="messages" id="messages"></div>

            <div class="view settings-panel hidden" id="settingsPanel">
                <div class="setting-row">
                    <div>
                        <h4>donkere modus</h4>
                        <p>maak alles *duister*</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="darkToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <div>
                        <h4>uitloggen</h4>
                        <p id="whoAmI"></p>
                    </div>
                    <button class="btn-sm danger" id="logoutBtn">uitloggen</button>
                </div>
            </div>

            <div class="view settings-panel hidden" id="adminPanel"></div>

            <div class="view settings-panel hidden" id="shopPanel"></div>

            <div class="composer hidden" id="composer">
                <div class="send-error hidden" id="sendError"></div>
                <div class="attach-tray hidden" id="attachTray"></div>
                <div class="message-input">
                    <button class="attach-btn" id="attachBtn" title="plaatje toevoegen" type="button">📎</button>
                    <input type="file" id="attachInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
                    <textarea id="messageBox" rows="1" maxlength="500" placeholder="typ typ typ typ"></textarea>
                    <button id="sendBtn">verstuur</button>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
