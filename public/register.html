<!doctype html>
<html>
  <head>
    <title>Registreren</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="login-container">
      <h1>Registreren</h1>
      <form id="registerForm">
        <input type="text" id="username" placeholder="hoe heet je" required>
        <input type="email" id="email" placeholder="je email" required>
        <input type="password" id="password" placeholder="je wachtwoord" required>
        <button type="submit">registreer</button>
      </form>
      <p id="error" class="error"></p>
      <p><a href="/">al een account? je zit namelijk op de registratiepagina, ga hier naar inloggen</a></p>
    </div>
    <script src="register.js"></script>
  </body>
</html>
